# The only installable package in this repository: the handful of DocuMind modules the benchmark's retrieval stage
# scores extractor output through (chunker, parser, embedder, reranker, models, config, logging), vendored under
# src/documind with their original package name. The benchmark harness itself is not installed; run it with
# PYTHONPATH=. from the repository root (see README.md).
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "documind-benchmark-vendored"
version = "0.1.0"
description = "DocuMind's chunker, embedder and reranker, vendored for the PDF extraction benchmark's retrieval stage"
readme = "README.md"
license = "MIT"
authors = [{ name = "Harshith Raju" }]
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "structlog>=24.4.0",
    "tiktoken>=0.8.0",
    "sentence-transformers>=3.3.0",
    "torch>=2.5.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/documind"]
